name: TikTok Tracker Automático

on:
  schedule:
    - cron: '30 4 * * *'  # 11:30 PM Hora Colombia (04:30 UTC)
  workflow_dispatch:       # Permite ejecución manual

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install apify-client

      - name: Ejecutar Script del Tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python app.py

      - name: Guardar cambios (solo HTML)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html || true
          git commit -m "Actualización automática: $(date +'%Y-%m-%d')" || exit 0
          git push
